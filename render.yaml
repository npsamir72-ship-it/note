services:
  - type: web
    name: accesshub-announcer
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: accesshub-data
      mountPath: /var/data
      sizeGB: 1